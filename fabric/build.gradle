plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

def dotenv = [:]
def envFile = file("../.env")
if (envFile.exists()) {
	envFile.eachLine { line ->
		def trimmed = line.trim()
		if (!trimmed || trimmed.startsWith("#")) return

		if (trimmed.startsWith("export ")) {
			trimmed = trimmed.substring("export ".length()).trim()
		}

		def separatorIndex = trimmed.indexOf("=")
		if (separatorIndex <= 0) return

		def key = trimmed.substring(0, separatorIndex).trim()
		def value = trimmed.substring(separatorIndex + 1).trim()
		if ((value.startsWith("'") && value.endsWith("'")) || (value.startsWith("\"") && value.endsWith("\""))) {
			value = value.substring(1, value.length() - 1)
		}

		dotenv[key] = value
	}
}

def envValue = { String key ->
	System.getenv(key) ?: dotenv[key]
}

ext.github_username = envValue("GITHUB_USERNAME") ?: ""
ext.github_pat = envValue("GITHUB_PAT") ?: ""

base {
	archivesName = project.archives_base_name
}

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
	mavenCentral()
	mavenLocal()

	maven {
		name = "Modrinth"
		url = uri("https://api.modrinth.com/maven")
	}

	//AuthMe
	maven {
		name = "TerraformersMC"
		url = "https://maven.terraformersmc.com/"
	}
	maven {
		name = 'Team Resourceful'
		url = 'https://maven.teamresourceful.com/repository/maven-public/'
	}
	maven {
		name = 'Sponge'
		url = 'https://repo.spongepowered.org/repository/maven-public'
	}
	maven {
		name = "GitHubPackages"
		url = "https://maven.pkg.github.com/axieum/authme"
		credentials {
			username = project.github_username
			password = project.github_pat
		}
	}
}

fabricApi {
	configureDataGeneration {
		client = true
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	//Wynnventory
	modImplementation "maven.modrinth:wynnventory:v${project.wynnventory_version}-fabric"
	include "maven.modrinth:wynnventory:v${project.wynnventory_version}-fabric"

	//Wynntils
	modImplementation "maven.modrinth:wynntils:v${project.wynntils_version}-fabric"
	include "maven.modrinth:wynntils:v${project.wynntils_version}-fabric"

	//AuthMe
	modImplementation "me.axieum.mcmod.authme:authme-fabric:${project.authme_version}"

	//ObjectMapper
	implementation "com.fasterxml.jackson.datatype:jackson-datatype-jdk8:2.17.2"
	include "com.fasterxml.jackson.datatype:jackson-datatype-jdk8:2.17.2"
	implementation "com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.17.2"
	include "com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.17.2"

	//AWS SDK
	implementation platform("software.amazon.awssdk:bom:2.29.52")
	implementation("software.amazon.awssdk:dynamodb") {
		exclude group: "software.amazon.awssdk", module: "apache-client"
		exclude group: "software.amazon.awssdk", module: "netty-nio-client"
	}
	implementation "software.amazon.awssdk:url-connection-client"

	def awsSdkModules = [
		"annotations", "auth", "aws-core", "aws-json-protocol", "checksums",
		"checksums-spi", "dynamodb", "endpoints-spi", "http-auth",
		"http-auth-aws", "http-auth-aws-eventstream", "http-auth-spi",
		"http-client-spi", "identity-spi", "json-utils", "metrics-spi",
		"profiles", "protocol-core", "regions", "retries", "retries-spi",
		"sdk-core", "third-party-jackson-core", "url-connection-client", "utils"
	]
	awsSdkModules.each { moduleName ->
		include "software.amazon.awssdk:${moduleName}:2.29.52"
	}
	include "software.amazon.eventstream:eventstream:1.0.1"
	include "org.reactivestreams:reactive-streams:1.0.4"

	//Junit Testing
	testImplementation 'org.junit.jupiter:junit-jupiter-api:5.8.1'
	testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.8.1'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

processResources {
	def properties = [
		version: project.version,
		loader_version: project.loader_version,
		minecraft_version: project.minecraft_version,
		wynnventory_version: project.wynnventory_version,
		wynntils_version: project.wynntils_version
	]

	inputs.properties properties

	filesMatching("fabric.mod.json") {
		expand properties
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	inputs.property "archivesName", project.base.archivesName

	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}

test {
	useJUnitPlatform()
}
